name: CI

# Um desenvolvedor, um caminho: lint e testes a cada push e em cada PR. Sem matriz de
# versões (o deploy é uma máquina só, Python fixado no Dockerfile) e sem cobertura
# mínima imposta — o que trava o merge é código quebrado, não uma meta de percentual.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão do Dockerfile: um CI que testa noutra versão avaliza o que não
          # roda em produção.
          python-version: "3.14"
          cache: pip

      # Os testes de métricas de FORMA decodificam áudio sintético pelo pydub, que
      # delega ao FFmpeg. Sem isto eles falhariam por falta de binário, não por
      # regressão — e um CI que falha por ambiente é um CI que se aprende a ignorar.
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Nenhum teste toca rede, cota de IA ou Postgres: as portas de `domain/ports.py`
      # deixam o pipeline inteiro rodar com dublês. Por isso não há serviço de banco aqui.
      - name: Testes
        run: pytest tests/ -v
