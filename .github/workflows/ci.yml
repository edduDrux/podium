name: CI

# Um desenvolvedor, um caminho: lint e testes a cada push e em cada PR. Sem matriz de
# versões (o deploy é uma máquina só, Python fixado no Dockerfile) e sem cobertura
# mínima imposta — o que trava o merge é código quebrado, não uma meta de percentual.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma versão do Dockerfile: um CI que testa noutra versão avaliza o que não
          # roda em produção.
          python-version: "3.14"
          cache: pip

      # Os testes de métricas de FORMA decodificam áudio sintético pelo pydub, que
      # delega ao FFmpeg. Sem isto eles falhariam por falta de binário, não por
      # regressão — e um CI que falha por ambiente é um CI que se aprende a ignorar.
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # Formatação checada, não aplicada: o CI aponta o arquivo fora do padrão e quem
      # corrige é quem fez a mudança, com `ruff format .`.
      - name: Formatação
        run: ruff format --check .

      # Tipos: pega adaptador divergindo da porta e `None` onde o código supõe valor —
      # o `runtime_checkable` das portas só confere a presença dos métodos, não as assinaturas.
      - name: Tipos
        run: mypy

      # Nenhum teste toca rede, cota de IA ou Postgres: as portas de `domain/ports.py`
      # deixam o pipeline inteiro rodar com dublês. Por isso não há serviço de banco aqui.
      - name: Testes
        run: pytest tests/ -v

  # A imagem é montada do zero a cada push: pega Dockerfile quebrado e dependência que
  # não instala — o tipo de defasagem que deixou a API local fora do ar por 36 h com uma
  # imagem antiga (DECISOES §11).
  imagem:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Emulação para montar a imagem ARM64 num runner x86.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Montar a imagem (amd64)
        run: docker buildx build --platform linux/amd64 --load -t podium-api:ci .

      # Teste de fumaça: a aplicação importa dentro da imagem, com as dependências que a
      # imagem de fato instalou.
      - name: Importar a aplicação na imagem
        run: docker run --rm podium-api:ci python -c "import app.main"

      # A VM da Oracle é ARM64 (CLAUDE.md §5). Montar para aarch64 prova que toda
      # dependência tem wheel para essa arquitetura — a imagem não tem compilador.
      - name: Montar a imagem (arm64)
        run: docker buildx build --platform linux/arm64 .
