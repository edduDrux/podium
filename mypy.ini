# Verificação de tipos (mypy). Modo não estrito no começo (DECISOES §11): o objetivo é
# pegar o que quebra em produção — adaptador divergindo da porta, `None` onde o código
# supõe valor —, não anotar o projeto inteiro de uma vez. Os testes ficam de fora por ora.
[mypy]
python_version = 3.14
# Os scripts entram porque nenhum teste os executa: sem o mypy, uma função renomeada
# no app só quebraria o script quando alguém o rodasse.
files = app, scripts
warn_unused_ignores = True
warn_redundant_casts = True

# Bibliotecas que não publicam tipos (sem `py.typed` nem pacote de stubs): o mypy trata o
# que vem delas como `Any` em vez de recusar o import.
[mypy-fitz.*]
ignore_missing_imports = True

[mypy-pydub.*]
ignore_missing_imports = True
